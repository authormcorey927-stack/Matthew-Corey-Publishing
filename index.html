<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Jump Jump Jump</title>
<style>
  body{
    margin:0;
    background:#0b0f1a;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
  }
  .stage{
    width:900px;
    height:400px;
    border-radius:16px;
    background:#121a2a;
    position:relative;
    overflow:hidden;
  }
  .dog{
    position:absolute;
    bottom:60px;
    font-size:72px;
    transform-origin:center center;
    will-change:transform;
  }
  .small{ font-size:56px; }

  /* Snappy, minimal-stretch jump (linear timing, short duration) */
  .jump{
    animation: jump 260ms linear;
  }
  @keyframes jump{
    0%{   transform: translate(var(--x),0) scaleX(var(--dir)); }
    50%{  transform: translate(var(--x),-78px) scaleX(var(--dir)); }
    100%{ transform: translate(var(--x),0) scaleX(var(--dir)); }
  }
</style>
</head>

<body>
<div class="stage" id="stage">
  <div class="dog big" id="big">🐕</div>
  <div class="dog small" id="small">🐕‍🦺</div>
</div>
