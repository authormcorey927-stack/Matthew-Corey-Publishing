<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Jump Jump Jump</title>
  <style>
    :root{
      --bg1:#0b0f1a;
      --bg2:#060812;
      --panel:rgba(255,255,255,.06);
      --stroke:rgba(255,255,255,.12);
      --ink:#eaf2ff;
      --muted:#a9bbdd;

      --bigSize: 82px;
      --smallSize: 58px;
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      color:var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 800px at 50% 15%, #15203b 0%, var(--bg1) 55%, var(--bg2) 100%);
      display:flex;
      flex-direction:column;
    }

    header{
      padding:18px 18px 10px;
      text-align:center;
    }
    header h1{margin:0;font-size:18px;letter-spacing:.4px}
    header p{margin:6px 0 0;color:var(--muted);font-size:13px}

    .wrap{
      flex:1;
      display:flex;
      justify-content:center;
      padding:10px 18px 22px;
    }

    .stage{
      width:min(980px, 100%);
      height:min(420px, 60vh);
      border-radius:18px;
      background: linear-gradient(180deg, rgba(255,255,255,.08) 0%, rgba(255,255,255,.02) 38%, rgba(0,0,0,0) 100%);
      border:1px solid var(--stroke);
      position:relative;
      overflow:hidden;
    }

    .hint{
      position:absolute;
      left:16px;
      top:14px;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(0,0,0,.25);
      border:1px solid rgba(255,255,255,.10);
      color:rgba(234,242,255,.75);
      font-size:12px;
      backdrop-filter: blur(6px);
      z-index:5;
    }

    .ground{
      position:absolute;
      left:0; right:0; bottom:0;
      height:110px;
      background: linear-gradient(180deg, rgba(18,26,42,0) 0%, rgba(18,26,42,.65) 18%, rgba(18,26,42,1) 100%);
      border-top:1px solid rgba(255,255,255,.06);
      z-index:1;
    }

    .dog{
      position:absolute;
      bottom:58px;
      will-change: transform;
      user-select:none;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.45));
      z-index:2;
      --x: 0px;
      --sx: 1;
      transform: translate3d(var(--x), 0, 0) scaleX(var(--sx));
    }
    .dog.big{font-size:var(--bigSize)}
    .dog.small{font-size:var(--smallSize)}

    /* subtle run bob (optional) */
    .run-bob{
      animation: bob 220ms ease-in-out infinite alternate;
    }
    @keyframes bob{
      from{ transform: translate3d(var(--x), 0px, 0) scaleX(var(--sx)); }
      to  { transform: translate3d(var(--x), -4px, 0) scaleX(var(--sx)); }
    }

    /* big jump animation (duration controlled in CSS; JS matches it) */
    .jump{
      animation: jump 380ms cubic-bezier(.2,.9,.25,1) 1;
    }
    @keyframes jump{
      0%   { transform: translate3d(var(--x), 0px, 0) scaleX(var(--sx)); }
      45%  { transform: translate3d(var(--x), -92px, 0) scaleX(var(--sx)); }
      100% { transform: translate3d(var(--x), 0px, 0) scaleX(var(--sx)); }
    }

    .controls{
      display:flex;
      gap:12px;
      justify-content:center;
      padding:0 18px 22px;
      flex-wrap:wrap;
    }
    button{
      border:none;
      padding:12px 16px;
      border-radius:14px;
      background:#111;
      color:#fff;
      font-weight:800;
      letter-spacing:.25px;
      cursor:pointer;
      border:1px solid rgba(255,255,255,.12);
    }
    button:hover{background:#141414}
    button:active{transform: translateY(1px)}
  </style>
</head>

<body>
  <header>
    <h1>Jump Jump Jump</h1>
    <p>Single-file version. Edit only the TUNING block if you want it faster/slower.</p>
  </header>

  <div class="wrap">
    <div class="stage" id="stage">
      <div class="hint">
        Click <b>Play</b>. Small dog runs in → catches big dog → big dog jumps 3× → small dog orbits → both exit.
      </div>

      <div class="dog big" id="bigDog" aria-label="big dog">🐕</div>
      <div class="dog small" id="smallDog" aria-label="small dog">🐕‍🦺</div>

      <div class="ground"></div>
    </div>
  </div>

  <div class="controls">
    <button id="playBtn">Play</button>
    <button id="resetBtn">Reset</button>
  </div>

<script>
/* =========================================================
   TUNING (edit these only)
   ========================================================= */

// Entry / chase feel
const BIG_ENTRY_LEAD_MS     = 0;    // leave at 0 (big dog already on stage)
const SMALL_ENTRY_DELAY_MS  = 80;   // was too slow before; 80 feels snappy
const CHASE_GAP_PX          = 85;   // how close small dog gets before "catch"

// Speeds (px per frame at ~60fps)
const SPEED_BIG_RUN   = 9.8;   // big dog drift/run (used in exits)
const SPEED_SMALL_RUN = 11.2;  // small dog chase speed (snappier)
const SPEED_EXIT      = 11.0;  // exit speed offscreen

// Jumps
const JUMP_COUNT      = 3;
const JUMP_GAP_MS     = 95;      // pause between landings and next jump
const JUMP_DURATION_MS= 380;     // MUST match CSS .jump duration above

// Orbit (small dog back-and-forth to simulate circling)
const ORBIT_PASSES         = 5;      // back-and-forth count
const ORBIT_WIDTH          = 170;    // was too small; bigger stops “turn too soon”
const SPEED_ORBIT          = 22.0;   // was too slow; higher feels decisive
const ORBIT_TRIGGER_FRACTION = 0.84; // “back end of jump” (later = more back-end)

// Micro pauses
const CATCH_PAUSE_MS = 120;


/* =========================================================
   Setup
   ========================================================= */

const stage    = document.getElementById('stage');
const bigDog   = document.getElementById('bigDog');
const smallDog = document.getElementById('smallDog');
const playBtn  = document.getElementById('playBtn');
const resetBtn = document.getElementById('resetBtn');

let raf = null;
let running = false;

const S = {
  w: 0,
  bigX: 0,
  smallX: 0,
  bigSX: 1,
  smallSX: 1,

  orbiting: false,
  orbitDir: 1,
  orbitCount: 0,
  orbitLeft: 0,
  orbitRight: 0,

  jumping: false,
};

function setVars(el, x, sx){
  el.style.setProperty('--x', `${x}px`);
  el.style.setProperty('--sx', sx);
  // keep base transform correct when no bob/jump
  if(!el.classList.contains('run-bob') && !el.classList.contains('jump')){
    el.style.transform = `translate3d(${x}px,0,0) scaleX(${sx})`;
  }
}

function apply(){
  setVars(bigDog, S.bigX, S.bigSX);
  setVars(smallDog, S.smallX, S.smallSX);
}

function stopRAF(){
  if(raf) cancelAnimationFrame(raf);
  raf = null;
}

function sleep(ms){
  return new Promise(r => setTimeout(r, ms));
}

function measure(){
  S.w = stage.clientWidth;

  // Place big dog a bit right of center; small dog offscreen left
  S.bigX   = Math.round(S.w * 0.56);
  S.smallX = -140;

  S.bigSX = 1;
  S.smallSX = 1;

  S.orbiting = false;
  S.orbitDir = 1;
  S.orbitCount = 0;

  bigDog.classList.remove('run-bob','jump');
  smallDog.classList.remove('run-bob','jump');

  apply();
}

/* =========================================================
   Sequence
   ========================================================= */

async function play(){
  if(running) return;
  running = true;
  playBtn.disabled = true;

  // Start run bob for life
  bigDog.classList.add('run-bob');
  smallDog.classList.add('run-bob');

  // Optional delay before small enters
  await sleep(SMALL_ENTRY_DELAY_MS);

  // Step 1: small runs in and "catches" big (meet near center)
  await smallRunToCatch();

  // pause after catch
  await sleep(CATCH_PAUSE_MS);

  // Step 2: big jumps 3 times; orbit triggers late in jump #1
  await bigJumpThreeAndTriggerOrbit();

  // Step 3: big exits right after 3rd landing
  await bigExit();

  // Step 4: small exits after orbit completes (wait if needed)
  await smallExit();

  running = false;
  playBtn.disabled = false;
}

function reset(){
  running = false;
  playBtn.disabled = false;
  stopRAF();
  measure();
}

/* =========================================================
   Actions
   ========================================================= */

function smallRunToCatch(){
  return new Promise((resolve) => {
    // “Catch point” just left of big dog
    const catchX = Math.round(S.w * 0.50);

    function step(){
      // move small right
      S.smallX += SPEED_SMALL_RUN;
      S.smallSX = 1;

      // keep big facing right, stationary
      S.bigSX = 1;

      apply();

      if(S.smallX >= catchX){
        S.smallX = catchX;
        apply();
        stopRAF();
        resolve();
        return;
      }
      raf = requestAnimationFrame(step);
    }

    raf = requestAnimationFrame(step);
  });
}

async function bigJumpThreeAndTriggerOrbit(){
  for(let i=0;i<JUMP_COUNT;i++){
    // start jump
    triggerJump(bigDog);

    // trigger orbit at back end of jump #1
    if(i === 0){
      const ms = Math.floor(JUMP_DURATION_MS * ORBIT_TRIGGER_FRACTION);
      setTimeout(() => {
        if(!S.orbiting){
          startOrbit();
        }
      }, ms);
    }

    // wait for jump to finish
    await sleep(JUMP_DURATION_MS);

    // ensure class is removed so we can re-trigger
    bigDog.classList.remove('jump');
    setVars(bigDog, S.bigX, S.bigSX);

    // little pause between jumps (except after last)
    if(i < JUMP_COUNT - 1){
      await sleep(JUMP_GAP_MS);
    }
  }
}

function triggerJump(el){
  el.classList.remove('jump');
  void el.offsetWidth; // reflow
  el.classList.add('jump');
}

function startOrbit(){
  S.orbiting = true;
  S.orbitCount = 0;

  const c = S.bigX;
  S.orbitLeft  = c - ORBIT_WIDTH;
  S.orbitRight = c + ORBIT_WIDTH;

  // start moving right first
  S.orbitDir = 1;
  orbitLoop();
}

function orbitLoop(){
  if(!S.orbiting) return;

  const target = (S.orbitDir === 1) ? S.orbitRight : S.orbitLeft;
  const dx = target - S.smallX;

  // step toward target
  const step = Math.sign(dx) * Math.min(Math.abs(dx), SPEED_ORBIT);
  S.smallX += step;

  // face direction
  S.smallSX = (S.orbitDir === 1) ? 1 : -1;

  apply();

  // reached target?
  if(Math.abs(target - S.smallX) <= 0.001){
    S.orbitDir *= -1;
    S.orbitCount += 1;

    if(S.orbitCount >= ORBIT_PASSES){
      S.orbiting = false;
      S.smallSX = 1; // face right for exit
      apply();
      return;
    }
  }

  raf = requestAnimationFrame(orbitLoop);
}

function bigExit(){
  return new Promise((resolve) => {
    S.bigSX = 1;

    function step(){
      S.bigX += SPEED_EXIT;
      apply();

      if(S.bigX > S.w + 180){
        stopRAF();
        resolve();
        return;
      }
      raf = requestAnimationFrame(step);
    }

    raf = requestAnimationFrame(step);
  });
}

async function smallExit(){
  // wait until orbit done
  while(S.orbiting){
    await sleep(30);
  }

  return new Promise((resolve) => {
    S.smallSX = 1;

    function step(){
      S.smallX += SPEED_EXIT;
      apply();

      if(S.smallX > S.w + 180){
        stopRAF();
        resolve();
        return;
      }
      raf = requestAnimationFrame(step);
    }

    raf = requestAnimationFrame(step);
  });
}

/* =========================================================
   Events
   ========================================================= */

playBtn.addEventListener('click', play);
resetBtn.addEventListener('click', reset);

window.addEventListener('resize', () => {
  if(!running) measure();
});

measure();
</script>
</body>
</html>
